workflows:
  flutter-ios-device:
    name: Mitron iOS Device
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Firebase config files
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > frontend/ios/Runner/GoogleService-Info.plist
          fi
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json
          fi
      - name: Get Flutter dependencies
        script: |
          cd frontend
          flutter pub get
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.mitron.mitron" --type IOS_APP_STORE
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS project for device
        script: |
          cd frontend
          flutter build ios --device --release
    artifacts:
      - frontend/build/ios/iphone/*.ipa